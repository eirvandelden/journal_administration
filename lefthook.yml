remotes:
  - git_url: https://github.com/eirvandelden/dotfiles.git
    ref: main
    refetch_frequency: 24h

# Jobs the shared dotfiles config does not have, plus small overrides of shared jobs.
# Where both name a job, lefthook merges the keys: the shared `run` stays, and a local key such as
# `skip` or `exclude` is added.
# Git exports GIT_DIR to its hooks. In a worktree it is absolute, and Bundler's git-sourced gems
# (appkit, mvpa-css) then read the wrong repository, so every Bundler job unsets it first.
pre-commit:
  commands:
    # erb_lint is not installed here; herb-lint checks ERB.
    erb_lint:
      skip: true
    # browserslist is not installed here, and .browserslistrc is a webpacker leftover.
    browserslist:
      skip: true
    # i18n-tasks normalize writes sequences that yamllint's indentation rule refuses.
    # i18n-normalized checks the locale files instead.
    yamllint:
      exclude: "config/locales/*.yml"
    herb-lint:
      glob: "*.erb"
      run: npx --no herb-lint {staged_files}
      fail_text: "herb-lint found ERB issues. Run: npx --no herb-lint --fix app/views/"
    i18n-normalized:
      glob: "config/locales/*.yml"
      run: |
        unset GIT_DIR
        bundle exec ruby ./bin/check_i18n_normalized
      fail_text: "Locale files must be normalized. Run: bundle exec i18n-tasks normalize"

pre-push:
  commands:
    erb_lint:
      skip: true
    browserslist:
      skip: true
    yamllint:
      exclude: "config/locales/*.yml"
    herb-lint-full:
      run: npx --no herb-lint app/views/
      fail_text: "herb-lint failed on full view scan"
    herb-analyze:
      run: |
        unset GIT_DIR
        bundle exec herb analyze app/views/
      fail_text: "herb analyze failed"
    i18n-normalized:
      run: |
        unset GIT_DIR
        bundle exec ruby ./bin/check_i18n_normalized
      fail_text: "Locale files must be normalized. Run: bundle exec i18n-tasks normalize"
