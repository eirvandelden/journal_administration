# Dated relative to today so each name stays true: a budget fixed to a calendar day drifts into
# the past and quietly starts standing for something else.
past_budget:
  starts_at: <%= 3.months.ago.beginning_of_day.to_fs(:db) %>
  ends_at: <%= 2.months.ago.end_of_day.to_fs(:db) %>

active_budget:
  starts_at: <%= 1.month.ago.beginning_of_day.to_fs(:db) %>
  ends_at: <%= (1.month.from_now.beginning_of_day - 1.day).end_of_day.to_fs(:db) %>

future_budget:
  starts_at: <%= 1.month.from_now.beginning_of_day.to_fs(:db) %>
  ends_at:
